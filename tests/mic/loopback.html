<!doctype html><meta charset="utf-8"><title>mic loopback</title>
<body style="font:14px sans-serif;padding:16px"><pre id="log">starting…</pre>
<script>
// Real-sound test page. Driven by tests/mic-loopback.js (do not open by hand unless you want to).
// loopback: plays notes through the device speaker, records them with the microphone, reads them with the app's own pitch detector.
// listen:   records N seconds from the microphone (play/sing/whistle anything) and prints the notes heard.
const Q = new URLSearchParams(location.search), MODE = Q.get('mode') || 'loopback', log = m => { document.getElementById('log').textContent += '\n' + m; };
const post = (p, body) => fetch(p, { method: 'POST', body }).catch(() => {});
const hzOf = m => 440 * Math.pow(2, (m - 69) / 12), cents = (a, b) => 1200 * Math.log2(a / b);
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function load() {   // the very same core files the app ships, in the order index.html lists them
  const list = await (await fetch('/api/core')).json();
  for (const s of list) await new Promise((ok, no) => { const e = document.createElement('script'); e.src = '/' + s; e.onload = ok; e.onerror = () => no(new Error('load ' + s)); document.head.append(e); });
}
async function openMic() {
  const base = { echoCancellation: false, noiseSuppression: false, autoGainControl: false, channelCount: 1 };   // same as the app
  const stream = await navigator.mediaDevices.getUserMedia({ audio: base });
  const c = new AudioContext(); await c.resume();
  const src = c.createMediaStreamSource(stream);
  const hp = c.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 70;           // the app's input filters
  const a = c.createBiquadFilter(), b = c.createBiquadFilter(); a.type = b.type = 'lowpass'; a.Q.value = 0.5412; b.Q.value = 1.3066; a.frequency.value = b.frequency.value = 6000;
  const sp = c.createScriptProcessor(4096, 1, 1), sink = c.createGain(); sink.gain.value = 0;
  const chunks = []; let n = 0; sp.onaudioprocess = e => { chunks.push(new Float32Array(e.inputBuffer.getChannelData(0))); n += 4096; };
  src.connect(hp); hp.connect(a); a.connect(b); b.connect(sp); sp.connect(sink); sink.connect(c.destination);
  const label = stream.getAudioTracks()[0].label;
  return { c, label, settings: stream.getAudioTracks()[0].getSettings(), mark: () => n, slice: (i, j) => { const out = new Float32Array(j - i); let pos = 0; for (const ch of chunks) { const s = Math.max(i, pos), e = Math.min(j, pos + ch.length); if (e > s) out.set(ch.subarray(s - pos, e - pos), s - i); pos += ch.length; } return out; } };
}
const rms = x => Math.sqrt(x.reduce((s, v) => s + v * v, 0) / (x.length || 1));
function fmt(x, sr, lo = 150, hi = 2000, id = null) {   // frames of 4096 samples, hop 2048, with a pitch engine (default: the app's own); median of the clear ones
  const f0 = id ? findEngine('f0', id) : getEngine('f0'), hz = [];
  for (let i = 0; i + 4096 <= x.length; i += 2048) { const r = f0.frame(x.subarray(i, i + 4096), sr, lo, hi); if (r && r.clarity >= 0.85) hz.push(r.freq); }
  hz.sort((p, q) => p - q); return { hz: hz.length ? hz[hz.length >> 1] : null, voiced: hz.length };
}
function tone(c, midi, t0, dur) {   // violin-ish: harmonics at 1/n, soft fade in and out
  const re = new Float32Array(9), im = new Float32Array(9); for (let n = 1; n < 9; n++) im[n] = 1 / n;
  const o = c.createOscillator(), g = c.createGain(); o.setPeriodicWave(c.createPeriodicWave(re, im)); o.frequency.value = hzOf(midi);
  g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(0.5, t0 + 0.03); g.gain.setValueAtTime(0.5, t0 + dur - 0.05); g.gain.linearRampToValueAtTime(0, t0 + dur);
  o.connect(g); g.connect(c.destination); o.start(t0); o.stop(t0 + dur + 0.02);
}
function synthTone(midi, sr, dur) { const x = new Float32Array(Math.floor(sr * dur)), f = hzOf(midi); for (let i = 0; i < x.length; i++) { let s = 0; for (let n = 1; n < 9; n++) s += Math.sin(2 * Math.PI * f * n * i / sr) / n; x[i] = 0.5 * s; } return x; }
(async () => {
  try {
    await load(); const M = await openMic(), sr = M.c.sampleRate;
    log('microphone: ' + M.label + '  ' + sr + ' Hz  processing ' + JSON.stringify({ ec: M.settings.echoCancellation, ns: M.settings.noiseSuppression, agc: M.settings.autoGainControl }));
    await sleep(800);
    if (MODE === 'listen') {
      const sec = +Q.get('sec') || 8; log('listening for ' + sec + ' s – make some sound now…'); const i0 = M.mark(); await sleep(sec * 1000); const x = M.slice(i0, M.mark());
      const frames = []; for (let i = 0; i + 4096 <= x.length; i += 2048) { const r = getEngine('f0').frame(x.subarray(i, i + 4096), sr, +Q.get('lo') || 70, +Q.get('hi') || 2000); frames.push({ t: +(i / sr).toFixed(2), hz: r && r.clarity >= 0.85 ? +r.freq.toFixed(2) : null, rms: +rms(x.subarray(i, i + 4096)).toFixed(4) }); }
      await post('/api/wav?name=listen', x.buffer); await post('/api/result', JSON.stringify({ mode: 'listen', sr, mic: M.label, frames })); return;
    }
    const notes = (Q.get('notes') || '69').split(',').map(Number), amb = M.slice(M.mark() - 8192, M.mark()), noise = rms(amb);
    const rows = [], all = [];
    // preflight: a loud A4 must be clearly louder than the room, else the speaker/mic path is not working (muted, wrong device)
    { const i0 = M.mark(); tone(M.c, 69, M.c.currentTime + 0.05, 0.8); await sleep(1100); const x = M.slice(i0 + Math.floor(sr * 0.2), i0 + Math.floor(sr * 0.7)); const lvl = rms(x);
      log(`preflight: room ${noise.toExponential(2)}  A4 through speaker ${lvl.toExponential(2)}`);
      if (lvl < noise * 2 || lvl < 0.002) { await post('/api/result', JSON.stringify({ mode: 'loopback', error: 'The microphone did not hear the speaker (room ' + noise.toExponential(2) + ', tone ' + lvl.toExponential(2) + '). Raise the volume, unmute, and pick the right default devices.' })); return; } }
    for (const midi of notes) {
      const i0 = M.mark(), t0 = M.c.currentTime + 0.1; tone(M.c, midi, t0, 1.1); await sleep(1600);
      const a = i0 + Math.floor(sr * 0.45), x = M.slice(a, a + 8192), real = fmt(x, sr), syn = fmt(synthTone(midi, sr, 0.5).subarray(0, 8192), sr);
      const truth = hzOf(midi); rows.push({ midi, level: +rms(x).toFixed(4), realHz: real.hz && +real.hz.toFixed(2), realCents: real.hz && +cents(real.hz, truth).toFixed(1), voiced: real.voiced, synthCents: syn.hz && +cents(syn.hz, truth).toFixed(1), engines: Object.fromEntries(['yin', 'pyin', 'mpm'].map(id => { const q = fmt(x, sr, 150, 2000, id); return [id, q.hz && +cents(q.hz, truth).toFixed(1)]; })) });
      all.push(M.slice(i0, M.mark()));
    }
    const tot = all.reduce((s, a) => s + a.length, 0), cat = new Float32Array(tot); let p = 0; for (const a of all) { cat.set(a, p); p += a.length; }
    await post('/api/wav?name=loopback', cat.buffer); await post('/api/result', JSON.stringify({ mode: 'loopback', sr, mic: M.label, noise, rows }));
  } catch (e) { await post('/api/result', JSON.stringify({ error: String(e && e.stack || e) })); }
})();
</script>
